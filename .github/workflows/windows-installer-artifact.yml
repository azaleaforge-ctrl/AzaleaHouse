name: Windows Installer Artifact

on:
  push:
    # Build packaging branches too, so the installer can be tested before this PR is merged.
    branches: [main, "build/**"]
    paths:
      - ".github/workflows/windows-installer-artifact.yml"
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Windows x64 installer
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned NSIS release
        shell: pwsh
        run: |
          $version = "3.13"
          $url = "https://sourceforge.net/projects/nsis/files/NSIS%203/$version/nsis-$version-setup.exe/download"
          $setupPath = Join-Path $env:RUNNER_TEMP "nsis-$version-setup.exe"
          $expectedSha256 = "db9a1038bbc0e53fef24f423fd609979bd578e942f1be1198db186d1c42652a3"

          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $setupPath -MaximumRedirection 10 -TimeoutSec 120
              $downloaded = $true
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }

          if (-not $downloaded -or -not (Test-Path $setupPath)) {
            throw "Unable to download the pinned NSIS installer."
          }

          $actualSha256 = (Get-FileHash -Path $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NSIS SHA-256 mismatch; refusing to execute the downloaded build dependency."
          }

          $nsisDirectory = Join-Path "${env:ProgramFiles(x86)}" "NSIS"
          $process = Start-Process -FilePath $setupPath -ArgumentList @("/S", "/D=$nsisDirectory") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS installer returned exit code $($process.ExitCode)."
          }

          $makensisPath = Join-Path $nsisDirectory "makensis.exe"
          if (-not (Test-Path $makensisPath)) {
            throw "Verified NSIS setup completed, but makensis.exe was not found at $makensisPath."
          }

          "$nsisDirectory" >> $env:GITHUB_PATH
          & $makensisPath /VERSION

      - name: Read app version
        id: app_version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app and NSIS installer
        run: npm run tauri:build

      - name: Verify installer and create checksum
        shell: pwsh
        run: |
          $installerDir = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $installerDir -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS setup.exe in $installerDir; found $($installers.Count)."
          }

          $installer = $installers[0]
          if ($installer.Length -le 0) {
            throw "The generated installer is empty."
          }

          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii

          @(
            "## Windows installer artifact"
            ""
            "- Version: $((Get-Content package.json -Raw | ConvertFrom-Json).version)"
            "- File: $($installer.Name)"
            "- Size: $([math]::Round($installer.Length / 1MB, 2)) MiB"
            "- SHA-256: $hash"
            "- Source commit: $env:GITHUB_SHA"
            ""
            "This is an unsigned development build uploaded as an Actions artifact. It is not a GitHub Release, and AzaleaHouse does not use this artifact to auto-install updates."
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzaleaHouse-Installer-v${{ steps.app_version.outputs.version }}-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
