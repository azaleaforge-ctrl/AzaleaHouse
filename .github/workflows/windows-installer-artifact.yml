name: Windows Installer Artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer-artifact.yml"
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Windows x64 installer
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw "NSIS makensis.exe was not found; the installer cannot be packaged."
          }

      - name: Read app version
        id: app_version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app and NSIS installer
        run: npm run tauri:build

      - name: Verify installer and create checksum
        shell: pwsh
        run: |
          $installerDir = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $installerDir -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS setup.exe in $installerDir; found $($installers.Count)."
          }

          $installer = $installers[0]
          if ($installer.Length -le 0) {
            throw "The generated installer is empty."
          }

          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii

          @(
            "## Windows installer artifact"
            ""
            "- Version: $((Get-Content package.json -Raw | ConvertFrom-Json).version)"
            "- File: $($installer.Name)"
            "- Size: $([math]::Round($installer.Length / 1MB, 2)) MiB"
            "- SHA-256: $hash"
            "- Source commit: $env:GITHUB_SHA"
            ""
            "This is an unsigned development build uploaded as an Actions artifact. It is not a GitHub Release, and AzaleaHouse does not use this artifact to auto-install updates."
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzaleaHouse-Installer-v${{ steps.app_version.outputs.version }}-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
