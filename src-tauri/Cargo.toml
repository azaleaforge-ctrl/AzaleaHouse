[package]
name = "azaleahouse"
version = "0.1.1"
description = "AzaleaHouse — AI assistant lokal untuk Windows"
authors = ["AzaleaHouse"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "azaleahouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "rt", "macros", "fs"] }
dirs = "5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "gzip",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
